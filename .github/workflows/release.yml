name: Android Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Decode upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/signing/upload-keystore.jks"
          test -s "$RUNNER_TEMP/signing/upload-keystore.jks"
      - name: Validate signing configuration
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/signing/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed AAB and APK
        timeout-minutes: 22
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean bundleRelease assembleRelease --no-daemon --console=plain
      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$AAB"
          test -s "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          ls -lh "$AAB" "$APK" app/build/outputs/mapping/release/mapping.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Super-Cleaner-Ultimate-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
      - name: Clean temporary signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/signing"

# Required repository secrets:
# ANDROID_KEYSTORE_BASE64
# ANDROID_KEYSTORE_PASSWORD
# ANDROID_KEY_ALIAS
# ANDROID_KEY_PASSWORD
