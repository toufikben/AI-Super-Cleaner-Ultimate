name: Android instrumentation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/android-instrumentation.yml'

permissions:
  contents: read

# Do not cancel an emulator run after it has started; run this workflow manually or nightly.
concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instrumentation:
    name: Emulator smoke and instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Run smoke and full instrumentation tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -euo pipefail
            adb devices -l
            adb shell pm list instrumentation | tee instrumentation-packages.txt
            test -s instrumentation-packages.txt
            timeout 8m ./gradlew connectedDebugAndroidTest \
              --tests 'com.aisupercleaner.ultimate.ManifestPolicyTest' \
              --tests 'com.aisupercleaner.ultimate.MediaStorePhase15Test' \
              --no-daemon --console=plain
            timeout 12m ./gradlew connectedDebugAndroidTest --no-daemon --console=plain
      - name: Collect instrumentation diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          mkdir -p instrumentation-diagnostics
          adb devices -l > instrumentation-diagnostics/devices.txt 2>&1
          adb shell pm list instrumentation > instrumentation-diagnostics/instrumentation-packages.txt 2>&1
          adb logcat -d -b all -t 2000 > instrumentation-diagnostics/logcat.txt 2>&1
          find app/build/reports/androidTests -type f -maxdepth 6 -print > instrumentation-diagnostics/report-files.txt 2>&1
          cp -R app/build/reports/androidTests instrumentation-diagnostics/androidTests 2>/dev/null
          cp instrumentation-packages.txt instrumentation-diagnostics/ 2>/dev/null
      - name: Publish instrumentation summary
        if: always()
        run: |
          {
            echo "## Android instrumentation"
            echo "- Device and runner discovery were attempted before tests."
            echo "- Smoke tests run before the full instrumentation suite."
            echo "- Diagnostics are uploaded as an artifact when the run fails."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics-${{ github.run_id }}
          path: instrumentation-diagnostics
          if-no-files-found: warn
          retention-days: 7
