name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit, lint, and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Run release QA checks
        timeout-minutes: 15
        run: ./scripts/qa_release.sh
      - name: Build unsigned release artifact
        timeout-minutes: 12
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Verify release artifact
        run: ./scripts/verify_release.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish build summary
        if: always()
        run: |
          {
            echo '## Android build'
            echo "- Commit: ${GITHUB_SHA}"
            echo '- QA, unit tests, lint, and unsigned release checks were attempted.'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
